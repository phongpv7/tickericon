name: Build and Release

# Pushing a version tag (e.g. v1.0.0) builds it and publishes its release;
# publishing a release by hand builds it and attaches the files too
on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Set application version
        shell: powershell
        run: |
          $version = $env:TAG -replace '^[vV]', ''
          (Get-Content src/version.py) -replace 'APP_VERSION = ".*"', ('APP_VERSION = "' + $version + '"') | Set-Content -Encoding utf8 src/version.py

      - name: Build executable
        run: pyinstaller tickericon.spec

      - name: Stage config and zip the distribution folder
        run: |
          Copy-Item config.cfg dist/TickerIcon/config.cfg
          Compress-Archive -Path dist/TickerIcon/* -DestinationPath dist/TickerIcon.zip

      # Not every windows-latest runner image ships Inno Setup
      - name: Install Inno Setup if missing
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build Windows installer
        shell: powershell
        run: |
          $version = $env:TAG -replace '^[vV]', ''
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\TickerIcon.iss

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = 'installer/output/TickerIcon-Setup.exe', 'dist/TickerIcon.zip'
          gh release view $env:TAG 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @assets --clobber
          } else {
            # A pushed tag has no release yet. Its annotation holds the release
            # notes, which checkout leaves out when it fetches the tag
            git fetch --force origin "refs/tags/$($env:TAG):refs/tags/$($env:TAG)"
            gh release create $env:TAG @assets --title "TickerIcon $($env:TAG)" --notes-from-tag
          }
