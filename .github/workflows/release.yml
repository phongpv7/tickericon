name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Set application version
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^[vV]', ''
          (Get-Content src/version.py) -replace 'APP_VERSION = ".*"', ('APP_VERSION = "' + $version + '"') | Set-Content -Encoding utf8 src/version.py

      - name: Build executable
        run: pyinstaller tickericon.spec

      - name: Stage config and zip the distribution folder
        run: |
          Copy-Item config.cfg dist/TickerIcon/config.cfg
          Compress-Archive -Path dist/TickerIcon/* -DestinationPath dist/TickerIcon.zip

      - name: Build Windows installer
        shell: powershell
        run: |
          $version = "${{ github.event.release.tag_name }}" -replace '^[vV]', ''
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\TickerIcon.iss

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" installer/output/TickerIcon-Setup.exe dist/TickerIcon.zip --clobber
